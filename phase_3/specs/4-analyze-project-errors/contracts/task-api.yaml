# API Contract: Task Management (Corrected)

## Overview
This API contract defines the task management endpoints with corrections for the field name inconsistencies that were previously identified and fixed.

## Base URL
`http://localhost:8000` (development) or your deployed URL

## Authentication
All endpoints require a valid JWT token in the Authorization header:
```
Authorization: Bearer {jwt_token}
```

## Task Operations

### GET /tasks/
Retrieve all tasks for the authenticated user.

**Request**:
```
GET /tasks/?skip=0&limit=100
Authorization: Bearer {jwt_token}
```

**Query Parameters**:
- `skip` (optional): Number of records to skip (default: 0)
- `limit` (optional): Maximum number of records to return (default: 100, max: 1000)

**Response**:
```json
[
  {
    "id": "uuid-string",
    "title": "Task title",
    "description": "Optional description",
    "status": "pending|in-progress|completed",
    "priority": "low|medium|high",
    "due_date": "2024-01-01T00:00:00Z",
    "created_at": "2024-01-01T00:00:00Z",
    "updated_at": "2024-01-01T00:00:00Z",
    "completed_at": "2024-01-01T00:00:00Z|null",
    "user_id": "uuid-string"
  }
]
```

### POST /tasks/
Create a new task for the authenticated user.

**Request**:
```
POST /tasks/
Content-Type: application/json
Authorization: Bearer {jwt_token}

{
  "title": "Task title",
  "description": "Optional description",
  "status": "pending",
  "priority": "medium",
  "due_date": "2024-01-01T00:00:00Z"
}
```

**Request Body**:
- `title` (required): String, task title
- `description` (optional): String, task description
- `status` (optional): String, one of "pending", "in-progress", "completed" (default: "pending")
- `priority` (optional): String, one of "low", "medium", "high" (default: "medium")
- `due_date` (optional): String, ISO 8601 datetime format

**Response**:
```json
{
  "id": "uuid-string",
  "title": "Task title",
  "description": "Optional description",
  "status": "pending|in-progress|completed",
  "priority": "low|medium|high",
  "due_date": "2024-01-01T00:00:00Z",
  "created_at": "2024-01-01T00:00:00Z",
  "updated_at": "2024-01-01T00:00:00Z",
  "completed_at": null,
  "user_id": "uuid-string"
}
```

### GET /tasks/{task_id}
Retrieve a specific task by ID.

**Request**:
```
GET /tasks/{task_id}
Authorization: Bearer {jwt_token}
```

**Path Parameters**:
- `task_id`: UUID string of the task to retrieve

**Response**:
Same as GET /tasks/ but for a single task.

### PUT /tasks/{task_id}
Update an existing task.

**Request**:
```
PUT /tasks/{task_id}
Content-Type: application/json
Authorization: Bearer {jwt_token}

{
  "title": "Updated title",
  "description": "Updated description",
  "status": "in-progress",
  "priority": "high",
  "due_date": "2024-01-01T00:00:00Z"
}
```

**Request Body** (all optional):
- `title`: String, updated task title
- `description`: String, updated task description
- `status`: String, one of "pending", "in-progress", "completed"
- `priority`: String, one of "low", "medium", "high"
- `due_date`: String, ISO 8601 datetime format

**Response**:
Same format as POST /tasks/ with updated values.

### DELETE /tasks/{task_id}
Delete a specific task.

**Request**:
```
DELETE /tasks/{task_id}
Authorization: Bearer {jwt_token}
```

**Path Parameters**:
- `task_id`: UUID string of the task to delete

**Response**:
```json
{
  "message": "Task deleted successfully"
}
```

## Error Responses
All endpoints may return the following error responses:

- `401 Unauthorized`: Missing or invalid JWT token
- `403 Forbidden`: User does not have permission to access the resource
- `404 Not Found`: Requested resource does not exist
- `422 Unprocessable Entity`: Request body validation failed
- `500 Internal Server Error`: Unexpected server error

## MCP Server Tools Contract

The MCP server provides the following tools for AI assistants:

### create_task
Creates a new task with the specified parameters.

### update_task
Updates an existing task with the specified parameters.

### delete_task
Deletes a task by ID.

### get_tasks
Retrieves tasks for the authenticated user with optional filtering.

### complete_task
Marks a task as completed or not completed (updates status field).

## Data Model Consistency
This API contract ensures consistency between frontend and backend by:
- Using the same status enum values ('pending', 'in-progress', 'completed')
- Properly handling optional fields with null safety
- Maintaining correct datetime formats
- Following proper error handling patterns