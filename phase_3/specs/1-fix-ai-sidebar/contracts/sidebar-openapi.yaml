openapi: 3.0.0
info:
  title: Sidebar and AI Assistant API
  version: 1.0.0
  description: API for managing sidebar state and AI assistant integration

paths:
  /api/sidebar/state:
    get:
      summary: Get current sidebar state
      responses:
        '200':
          description: Current sidebar state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidebarState'
    put:
      summary: Update sidebar state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SidebarStateUpdate'
      responses:
        '200':
          description: Sidebar state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidebarState'

  /api/assistant/config:
    get:
      summary: Get AI assistant configuration
      responses:
        '200':
          description: AI assistant configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantConfig'
    put:
      summary: Update AI assistant configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantConfigUpdate'
      responses:
        '200':
          description: Assistant configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantConfig'

components:
  schemas:
    SidebarState:
      type: object
      properties:
        id:
          type: string
        isVisible:
          type: boolean
          default: true
        isCollapsed:
          type: boolean
          default: false
        width:
          type: number
          default: 320
        position:
          type: string
          enum: [left, right]
          default: left
        lastUpdated:
          type: string
          format: date-time
      required:
        - id
        - isVisible
        - isCollapsed
        - width
        - position

    SidebarStateUpdate:
      type: object
      properties:
        isVisible:
          type: boolean
        isCollapsed:
          type: boolean
        width:
          type: number
        position:
          type: string
          enum: [left, right]

    AssistantConfig:
      type: object
      properties:
        id:
          type: string
        serviceEndpoint:
          type: string
        isAvailable:
          type: boolean
          default: true
        displayPreferences:
          type: object
        lastConnectionCheck:
          type: string
          format: date-time
        status:
          type: string
          enum: [online, offline, error]
          default: online
      required:
        - id
        - serviceEndpoint
        - isAvailable
        - status

    AssistantConfigUpdate:
      type: object
      properties:
        serviceEndpoint:
          type: string
        displayPreferences:
          type: object