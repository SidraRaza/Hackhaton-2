openapi: 3.0.3
info:
  title: AI Conversational Task Management API
  description: API for AI-powered conversational task management system
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.example.com
    description: Production server

paths:
  /api/chat:
    post:
      summary: Process chat message and return AI response
      description: Handles user messages and returns AI-generated responses for task management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response with AI message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/conversations:
    get:
      summary: List user conversations
      description: Retrieve all conversations for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/conversations/{conversation_id}:
    get:
      summary: Get conversation details
      description: Retrieve details and messages for a specific conversation
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the conversation to retrieve
      responses:
        '200':
          description: Conversation details with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationWithMessages'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: User's message to the AI assistant
          example: "Create a task to buy groceries"
        conversation_id:
          type: string
          description: Optional conversation ID to continue existing conversation
          example: "conv_abc123xyz"

    ChatResponse:
      type: object
      required:
        - response
        - conversation_id
      properties:
        response:
          type: string
          description: AI-generated response
          example: "I've created a task 'buy groceries' for you."
        conversation_id:
          type: string
          description: ID of the conversation
          example: "conv_abc123xyz"
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    ToolCall:
      type: object
      properties:
        id:
          type: string
          description: ID of the tool call
        type:
          type: string
          description: Type of tool call (currently always "function")
        function:
          type: object
          properties:
            name:
              type: string
              description: Name of the function called
            arguments:
              type: string
              description: Arguments passed to the function

    Message:
      type: object
      required:
        - id
        - role
        - content
        - timestamp
      properties:
        id:
          type: string
          description: Unique identifier for the message
        role:
          type: string
          enum: [user, assistant, tool]
          description: Role of the message sender
        content:
          type: string
          description: Content of the message
        timestamp:
          type: string
          format: date-time
          description: When the message was created
        tool_call_id:
          type: string
          description: ID of the tool call if this is a tool message

    Conversation:
      type: object
      required:
        - id
        - user_id
        - title
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the conversation
        user_id:
          type: string
          description: ID of the user who owns the conversation
        title:
          type: string
          description: Auto-generated title based on conversation topic
        created_at:
          type: string
          format: date-time
          description: When the conversation was created
        updated_at:
          type: string
          format: date-time
          description: When the conversation was last updated
        is_active:
          type: boolean
          description: Whether the conversation is currently active

    ConversationWithMessages:
      type: object
      required:
        - conversation
        - messages
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Not authenticated"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Validation error occurred"

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Conversation not found"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "An unexpected error occurred"

    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message