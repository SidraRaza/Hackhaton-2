# Frontend Routing Contract: UI Simplification

## Overview
This document defines the frontend routing structure for the simplified UI. The routing contracts remain compatible with existing backend APIs while optimizing the user navigation experience.

## Route Definitions

### Public Routes
- `/` - Main dashboard (redirects to authenticated dashboard if logged in)
- `/login` - Login page
- `/register` - Registration page
- `/forgot-password` - Password reset page

### Protected Routes
- `/dashboard` - Main dashboard (primary entry point)
- `/tasks` - Task management page
- `/tasks/[id]` - Individual task view
- `/settings` - User settings page
- `/profile` - User profile page

### Semantic Route Improvements
#### Before (Complex/Non-semantic)
- `/app/dashboard/main-view/overview`
- `/user-management/profile/edit-personal-info`
- `/task-management/active-tasks/list-view/all`

#### After (Simplified)
- `/dashboard` (consolidated from multiple nested routes)
- `/profile` (flattened from deeply nested structure)
- `/tasks` (streamlined from complex nested paths)

## Navigation Patterns

### Main Navigation
```
Dashboard -> Tasks -> Profile -> Settings
```

### Breadcrumb Trail
```
Home / Section / Subsection (where applicable)
```

### Mobile Navigation
- Hamburger menu for secondary navigation
- Bottom navigation for primary actions on mobile

## URL Parameters
- `[id]` - Generic identifier for entity-specific routes
- `?filter=` - Optional query parameter for filtering views
- `?view=` - Optional query parameter for specifying view type

## Redirects and Guards
- Unauthenticated users redirected from protected routes to `/login`
- Authenticated users redirected from login/register to `/dashboard`
- Invalid routes redirect to 404 page or main dashboard

## Backward Compatibility
All routing changes maintain backward compatibility:
- Old routes either redirect to new simplified routes
- API endpoints remain unchanged
- External links are handled gracefully

## Error Handling
- 404: Route not found - Display user-friendly error page
- 403: Unauthorized access - Redirect to login
- Network errors: Display connection status with retry option