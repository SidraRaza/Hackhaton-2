apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
type: Opaque
data:
  # These would be base64 encoded values in a real deployment
  database-url: <base64-encoded-database-url>
  kafka-brokers: <base64-encoded-kafka-brokers>
  jwt-secret: <base64-encoded-jwt-secret>
  encryption-key: <base64-encoded-encryption-key>
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: todo-secrets-store
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []