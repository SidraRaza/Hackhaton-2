apiVersion: v1
kind: Namespace
metadata:
  name: todo-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-backend-config
  namespace: todo-app
data:
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/todo_app"
  KAFKA_BROKERS: "kafka-service:9092"
  ENVIRONMENT: "development"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-frontend-config
  namespace: todo-app
data:
  NEXT_PUBLIC_API_URL: "http://backend-service:8000"
  NEXT_PUBLIC_WEBSOCKET_URL: "ws://backend-service:8000/ws"
  ENVIRONMENT: "development"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
  namespace: todo-app
type: Opaque
data:
  # These would be base64 encoded in a real deployment
  # Use kubectl create secret to create these properly
  database-password: cG9zdGdyZXM=  # "postgres" in base64
  jwt-secret: aG9wZWZ1bGx5LXNlY3JldC1rZXk=  # "hopefully-secret-key" in base64
  openai-api-key: ""