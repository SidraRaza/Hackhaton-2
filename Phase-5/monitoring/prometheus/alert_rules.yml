groups:
  - name: todo-app.rules
    rules:
      - alert: TodoAppDown
        expr: up{job="todo-app"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Todo App is down"
          description: "Todo App has been down for more than 5 minutes."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "HTTP error rate is above 5% for the last 5 minutes."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% for instance {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 85% for instance {{ $labels.instance }}."

      - alert: DaprSidecarDown
        expr: up{job="dapr"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Dapr sidecar is down"
          description: "Dapr sidecar for pod {{ $labels.kubernetes_pod_name }} has been down for more than 3 minutes."

      - alert: KafkaConnectionError
        expr: dapr_redis_connected_clients == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka connection error"
          description: "Dapr component cannot connect to Kafka for pod {{ $labels.kubernetes_pod_name }}."

      - alert: DatabaseConnectionError
        expr: dapr_statestore_get_failures_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection error"
          description: "Dapr state store component is failing to connect to database."

      - alert: TaskProcessingLatencyHigh
        expr: histogram_quantile(0.95, rate(dapr_app_http_request_duration_seconds_bucket[5m])) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High task processing latency"
          description: "95th percentile of task processing requests is taking more than 5 seconds."