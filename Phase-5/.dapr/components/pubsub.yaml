apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: todo-app
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "redpanda:9092"
  - name: consumerGroup
    value: "todo-group"
  - name: disableTls
    value: "false"
  - name: authType
    value: "none"
  - name: initialOffset
    value: "newest"